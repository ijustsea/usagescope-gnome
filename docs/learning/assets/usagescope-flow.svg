<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="100%" height="100%" fill="white"/><text x="30" y="44" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="32" font-weight="700" text-anchor="start">UsageScope | 서비스 동작 흐름</text><text x="30" y="80" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">같은 화면으로 합치되, 요청형 Codex와 수신형 Claude를 다르게 처리합니다.</text><rect x="20" y="120" width="1400" height="185" rx="16" fill="#f8fbff" stroke="#2864dc" stroke-dasharray="7 6" stroke-width="1.4"/><text x="38" y="149" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">Codex · 필요한 때 조회</text><polyline points="240,226 269,226" fill="none" stroke="#2864dc" stroke-width="2.2" stroke-linejoin="round"/><polygon points="269,226 259.3465918192059,231.27368092464624 259.3465918192059,220.72631907535376" fill="#2864dc"/><rect x="35" y="175" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="51" y="209" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">1. 모니터링 켜기</text><text x="51" y="236" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">사용자가 명시적으로 선택</text><polyline points="474,226 503,226" fill="none" stroke="#2864dc" stroke-width="2.2" stroke-linejoin="round"/><polygon points="503,226 493.3465918192059,231.27368092464624 493.3465918192059,220.72631907535376" fill="#2864dc"/><rect x="269" y="175" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="285" y="209" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">2. 경로·권한 검사</text><text x="285" y="236" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">신뢰한 CLI를 argv로 실행</text><polyline points="708,226 737,226" fill="none" stroke="#2864dc" stroke-width="2.2" stroke-linejoin="round"/><polygon points="737,226 727.3465918192059,231.27368092464624 727.3465918192059,220.72631907535376" fill="#2864dc"/><rect x="503" y="175" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="519" y="209" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">3. 초기화·한도 요청</text><text x="519" y="236" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">JSONL ID로 응답 연결</text><polyline points="942,226 971,226" fill="none" stroke="#2864dc" stroke-width="2.2" stroke-linejoin="round"/><polygon points="971,226 961.3465918192059,231.27368092464624 961.3465918192059,220.72631907535376" fill="#2864dc"/><rect x="737" y="175" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="753" y="209" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">4. 입력·계정 검사</text><text x="753" y="236" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">범위·기간·출처 확인</text><polyline points="1176,226 1205,226" fill="none" stroke="#2864dc" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1205,226 1195.346591819206,231.27368092464624 1195.346591819206,220.72631907535376" fill="#2864dc"/><rect x="971" y="175" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="987" y="209" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">5. 잔여율 표시</text><text x="987" y="236" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">사용률 97 → 잔여 3%</text><rect x="1205" y="175" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="1221" y="209" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">6. 프로세스 정리</text><text x="1221" y="236" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">EOF → 기한 내 종료 대기</text><rect x="20" y="345" width="1400" height="185" rx="16" fill="#f8fbff" stroke="#d47b32" stroke-dasharray="7 6" stroke-width="1.4"/><text x="38" y="374" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">Claude · 기존 상태줄에서 수신</text><polyline points="240,451 269,451" fill="none" stroke="#d47b32" stroke-width="2.2" stroke-linejoin="round"/><polygon points="269,451 259.3465918192059,456.2736809246462 259.3465918192059,445.7263190753538" fill="#d47b32"/><rect x="35" y="400" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="51" y="434" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">1. 상태줄 JSON</text><text x="51" y="461" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">기존 Claude가 전달</text><polyline points="474,451 503,451" fill="none" stroke="#d47b32" stroke-width="2.2" stroke-linejoin="round"/><polygon points="503,451 493.3465918192059,456.2736809246462 493.3465918192059,445.7263190753538" fill="#d47b32"/><rect x="269" y="400" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="285" y="434" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">2. 전달 도구 실행</text><text x="285" y="461" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">입력량·필드 검증</text><polyline points="708,451 737,451" fill="none" stroke="#d47b32" stroke-width="2.2" stroke-linejoin="round"/><polygon points="737,451 727.3465918192059,456.2736809246462 727.3465918192059,445.7263190753538" fill="#d47b32"/><rect x="503" y="400" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="519" y="434" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">3. 최소 정보만 추출</text><text x="519" y="461" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">선택적 구독 정보 캐시</text><polyline points="942,451 971,451" fill="none" stroke="#d47b32" stroke-width="2.2" stroke-linejoin="round"/><polygon points="971,451 961.3465918192059,456.2736809246462 961.3465918192059,445.7263190753538" fill="#d47b32"/><rect x="737" y="400" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="753" y="434" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">4. 불변 파일 발행</text><text x="753" y="461" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">고유 이름·원자적 이동</text><polyline points="1176,451 1205,451" fill="none" stroke="#d47b32" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1205,451 1195.346591819206,456.2736809246462 1195.346591819206,445.7263190753538" fill="#d47b32"/><rect x="971" y="400" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="987" y="434" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">5. 변경 알림 수신</text><text x="987" y="461" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">명시적 세션 하나 선택</text><rect x="1205" y="400" width="205" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><text x="1221" y="434" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">6. 마지막 보고 표시</text><text x="1221" y="461" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">수신 시각 ≠ 서버 시각</text><rect x="20" y="575" width="1400" height="195" rx="16" fill="#f8fbff" stroke="#078665" stroke-dasharray="7 6" stroke-width="1.4"/><text x="38" y="604" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">공통 안전 규칙</text><rect x="55" y="630" width="375" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><rect x="69" y="644" width="30" height="28" rx="7" fill="#078665"/><text x="84" y="664" fill="white" font-family="NanumGothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle">!</text><text x="110" y="664" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">오류·누락·만료</text><text x="71" y="691" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">0·null·미보고를 구분</text><text x="71" y="716" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">시간 경과로 100%를 만들지 않음</text><rect x="530" y="630" width="375" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><rect x="544" y="644" width="30" height="28" rx="7" fill="#078665"/><text x="559" y="664" fill="white" font-family="NanumGothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle">S</text><text x="585" y="664" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">출처·시각·세대 관리</text><text x="546" y="691" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">다른 계정·세션을 합치지 않음</text><text x="546" y="716" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">종료 뒤 늦은 응답은 반영하지 않음</text><rect x="1005" y="630" width="375" height="105" rx="12" fill="white" stroke="#9db4df" stroke-width="1.4"/><rect x="1019" y="644" width="30" height="28" rx="7" fill="#078665"/><text x="1034" y="664" fill="white" font-family="NanumGothic, sans-serif" font-size="15" font-weight="700" text-anchor="middle">UI</text><text x="1060" y="664" fill="#0d1b46" font-family="NanumGothic, sans-serif" font-size="20" font-weight="700" text-anchor="start">잔여 30 / 회복 35</text><text x="1021" y="691" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">30% 이하는 빨강 · 아래 진입 시 알림</text><text x="1021" y="716" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">Claude 알림은 마지막 보고값 기준</text><polyline points="430,681 530,681" fill="none" stroke="#078665" stroke-width="2.2" stroke-linejoin="round"/><polygon points="530,681 520.3465918192059,686.2736809246462 520.3465918192059,675.7263190753538" fill="#078665"/><polyline points="905,681 1005,681" fill="none" stroke="#078665" stroke-width="2.2" stroke-linejoin="round"/><polygon points="1005,681 995.3465918192059,686.2736809246462 995.3465918192059,675.7263190753538" fill="#078665"/><text x="30" y="817" fill="#4d5d7b" font-family="NanumGothic, sans-serif" font-size="17" font-weight="400" text-anchor="start">설정·데이터는 실행 중 갱신됩니다. Wayland에서 JavaScript 코드 변경을 확실히 적용하려면 새 GNOME 세션이 필요합니다.</text></svg>